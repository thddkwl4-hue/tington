<style>

.adminLoginCard{width:min(380px,100%);background:#fff;border:1px solid #E1E7E2;border-radius:16px;padding:28px;box-shadow:0 10px 30px rgba(20,40,30,.08);text-align:center}
.adminLoginIcon{width:52px;height:52px;border-radius:12px;background:#1B5E45;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff}
.adminLoginTitle{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;margin-bottom:6px}
.adminLoginSub{font-size:12.5px;color:#7C8B84;margin-bottom:20px}
.adminLoginForm{display:flex;flex-direction:column;gap:9px}

.adminLoginBtn{width:100%;border:none;border-radius:9px;padding:11px;background:#1B5E45;color:#fff;font-size:13px;font-weight:700}

<body>

<div id="adminLock">
  <div class="adminLoginCard">
    <div class="adminLoginIcon">🏸</div>
    <div class="adminLoginTitle">팅턴 게임판</div>
    <div class="adminLoginSub">관리자 비밀번호를 입력해주세요.<br>(기본 비밀번호: 1234)</div>
    <form class="adminLoginForm" onsubmit="return adminLogin(event)">
      <input id="adminPasswordInput" class="adminLoginInput" type="password" placeholder="비밀번호 입력" autocomplete="current-password">
      <button class="adminLoginBtn" type="submit">입장하기</button>
      <div id="adminLoginError" class="adminLoginError"></div>
    </form>
  </div>
</div>
<button id="adminLogoutBtn" class="adminLogout" onclick="adminLogout()" style="display:none">관리자 잠금</button>

<div id="app"></div>

<script>
// ==========================================
// 1. FIREBASE 설정 및 초기화
// ==========================================
const firebaseConfig = {
  apiKey: "AIzaSyBTfNwe0ia9CN9gFCq2_G39Hea8aS9K9Nk",
  authDomain: "tingtongame.firebaseapp.com",
  databaseURL: "https://tingtongame-default-rtdb.firebaseio.com",
  projectId: "tingtongame",
  storageBucket: "tingtongame.firebasestorage.app",
  messagingSenderId: "322367917053",
  appId: "1:322367917053:web:d60ab1929672d2aec2a794",
  measurementId: "G-ECY6S8PH6C"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();

// ==========================================
// 2. 앱 변수 및 상수
// ==========================================
const TIER_COLOR={S:"#C24A3B",A:"#C2683B",B:"#B08900",C:"#1B5E45",D:"#3B6FA0","초심":"#7C8B84","왕초심":"#9A8B7C"};
const GENDER_COLOR={M:"#8B5CF6",F:"#D4A017"};
const STATUS_LABEL={waiting:"대기 중",resting:"쉬는 중",playing:"경기 중",queued:"다음 대기",grouped:"대기조"};

let players=[], courts=initCourts(2), overlap={}, tab="courts";
let newName="", newTier="B", newGender="M", assigningCourtId=null;
let members=[], newMemberName="", newMemberTier="B", newMemberGender="M";
let waitingGroups=[], isBuildingGroup=false, buildingGroupSelection=[];
let nextId=1, memberNextId=1, groupNextId=1, loaded=false;

function pairKey(a,b){return a<b?`${a}_${b}`:`${b}_${a}`}
function combinations(arr,k){
 const result=[],combo=[];
 function helper(start){
  if(combo.length===k){result.push([...combo]);return}
  for(let i=start;i<arr.length;i++){combo.push(arr[i]);helper(i+1);combo.pop()}
 }
 helper(0);return result;
}
function formatElapsed(ms){
 if(!ms) return "00:00";
 const total=Math.max(0,Math.floor((Date.now()-ms)/1000));
 const m=Math.floor(total/60),s=total%60;
 return `${m}:${String(s).padStart(2,"0")}`;
}
function initCourts(n){return Array.from({length:n},(_,i)=>({id:i+1,playerIds:[],startTime:null,gameCount:0,nextPlayerIds:[]}))}

// ==========================================
// 3. FIREBASE 실시간 동기화
// ==========================================
db.ref("badminton_v1").on("value", (snapshot) => {
  const data = snapshot.val() || {};
  players = data.players || [];
  courts = (data.courts && data.courts.length) ? data.courts : initCourts(2);
  overlap = data.overlap || {};
  members = data.members || [];
  waitingGroups = data.waitingGroups || [];
  
  if (players.length > 0) nextId = Math.max(...players.map(p => p.id || 0)) + 1;
  if (members.length > 0) memberNextId = Math.max(...members.map(m => m.id || 0)) + 1;
  if (waitingGroups.length > 0) groupNextId = Math.max(...waitingGroups.map(g => g.id || 0)) + 1;
  
  loaded = true;
  render();
});

function save(){
  if(!loaded) return;
  db.ref("badminton_v1").set({
    players: players || [],
    courts: courts || [],
    overlap: overlap || {},
    members: members || [],
    waitingGroups: waitingGroups || []
  });
}

// 관리자 로그인
function adminLogin(e){
  e.preventDefault();
  const pwd = document.getElementById("adminPasswordInput").value;
  if(pwd === "1234"){
    document.getElementById("adminLock").classList.add("hidden");
    document.getElementById("adminLogoutBtn").style.display="block";
    localStorage.setItem("tington_admin","true");
  } else {
    document.getElementById("adminLoginError").innerText = "비밀번호가 올바르지 않습니다.";
  }
  return false;
}
function adminLogout(){
  localStorage.removeItem("tington_admin");
  document.getElementById("adminLock").classList.remove("hidden");
  document.getElementById("adminLogoutBtn").style.display="none";
}
window.addEventListener("DOMContentLoaded",()=>{
  if(localStorage.getItem("tington_admin")==="true"){
    document.getElementById("adminLock")?.classList.add("hidden");
    const btn = document.getElementById("adminLogoutBtn");
    if(btn) btn.style.display="block";
  }
});

// 타이머 주기적 업데이트
setInterval(()=>{
  if(tab==="courts" && courts.some(c=>c.startTime)){
    render();
  }
}, 1000);

// ==========================================
// 4. 로직 함수들
// ==========================================
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function player(id){return players.find(p=>p.id===id)}
function genderColor(p){return p&&GENDER_COLOR[p.gender]||"#16231F"}
function tierBadge(p,small=false){return `<span class="${small?"tierBadgeSm":"tierBadge"}" style="color:${TIER_COLOR[p.tier]||'#7C8B84'}">${esc(p.tier)}</span>`}
function statusBadge(s){return `<span class="badge ${s}">${STATUS_LABEL[s]||s}</span>`}
function icon(name,size=14){return `<i data-lucide="${name}" width="${size}" height="${size}"></i>`}

function addPlayer(){
 const name=newName.trim(); if(!name)return;
 const p={id:nextId++,name,tier:newTier,gender:newGender,games:0,status:"waiting",courtId:null,waitSince:Date.now()};
 players.push(p); newName=""; save(); render();
}
function removePlayer(id){players=players.filter(p=>p.id!==id);save();render()}
function clearAllPlayers(){
 if(players.length===0)return;
 if(!confirm("오늘 참석자 명단을 전체 삭제할까요?"))return;
 players=[]; courts=courts.map(c=>({...c,playerIds:[],nextPlayerIds:[],startTime:null}));
 waitingGroups=[]; assigningCourtId=null; save(); render();
}
function addMember(){
 const name=newMemberName.trim(); if(!name)return;
 members.push({id:memberNextId++,name,tier:newMemberTier,gender:newMemberGender});
 newMemberName=""; save(); render();
}
function removeMember(id){members=members.filter(m=>m.id!==id);save();render()}
function addMemberToday(memberId){
 const m=members.find(x=>x.id===memberId);
 if(!m||players.some(p=>p.memberId===memberId))return;
 players.push({id:nextId++,name:m.name,tier:m.tier,gender:m.gender,memberId:m.id,games:0,status:"waiting",courtId:null,waitSince:Date.now()});
 save();render();
}
function toggleRest(id){
 players=players.map(p=>p.id!==id?p:(p.status==="waiting"?{...p,status:"resting"}:p.status==="resting"?{...p,status:"waiting",waitSince:Date.now()}:p));
 save();render();
}
function changeCourtCount(n){
 if(n===courts.length)return;
 if(n>courts.length){
  courts=[...courts,...Array.from({length:n-courts.length},(_,i)=>({id:courts.length+i+1,playerIds:[],startTime:null,gameCount:0,nextPlayerIds:[]}))];
 }else{
  if(courts.slice(n).some(c=>c.playerIds.length>0)){alert("경기 중인 코트는 줄일 수 없어요.");return}
  courts=courts.slice(0,n);
 }
 save();render();
}
function addToCourt(courtId,playerId){
 const court=courts.find(c=>c.id===courtId); if(!court)return;
 if(court.playerIds.length===4){
  const nq=court.nextPlayerIds||[];
  if(nq.includes(playerId)||nq.length>=4)return;
  const ids=[...nq,playerId];
  courts=courts.map(c=>c.id===courtId?{...c,nextPlayerIds:ids}:c);
  players=players.map(p=>p.id===playerId?{...p,status:"queued",courtId}:p);
  if(ids.length===4)assigningCourtId=null;
  save();render(); return;
 }
 if(court.playerIds.includes(playerId)||court.playerIds.length>=4)return;
 const ids=[...court.playerIds,playerId], starting=ids.length===4;
 courts=courts.map(c=>c.id===courtId?{...c,playerIds:ids,startTime:starting?Date.now():null}:c);
 players=players.map(p=>p.id===playerId?{...p,status:"playing",courtId}:p);
 if(starting)assigningCourtId=null;
 save();render();
}
function autoMatch(courtId){
 const waiting=players.filter(p=>p.status==="waiting");
 if(waiting.length<4){alert("대기 중인 선수가 4명 이상이어야 합니다.");return}
 const sorted=[...waiting].sort((a,b)=>a.games-b.games||a.waitSince-b.waitSince);
 const pool=sorted.slice(0,Math.min(10,sorted.length)), combos=combinations(pool,4);
 let best=combos[0],bestScore=Infinity;
 for(const combo of combos){
  const gamesSum=combo.reduce((s,p)=>s+p.games,0);
  let overlapSum=0;
  for(let i=0;i<4;i++)for(let j=i+1;j<4;j++)overlapSum+=(overlap[pairKey(combo[i].id,combo[j].id)]||0);
  const score=gamesSum*1000+overlapSum;
  if(score<bestScore){bestScore=score;best=combo}
 }
 const ids=best.map(p=>p.id);
 courts=courts.map(c=>c.id===courtId?{...c,playerIds:ids,startTime:Date.now()}:c);
 players=players.map(p=>ids.includes(p.id)?{...p,status:"playing",courtId}:p);
 assigningCourtId=null; save(); render();
}
function endGame(courtId){
 const court=courts.find(c=>c.id===courtId);
 if(!court||court.playerIds.length!==4)return;
 const ids=court.playerIds;
 players=players.map(p=>ids.includes(p.id)?{...p,games:p.games+1,status:"waiting",courtId:null,waitSince:Date.now()}:p);
 const next={...overlap};
 for(let i=0;i<4;i++)for(let j=i+1;j<4;j++){const k=pairKey(ids[i],ids[j]);next[k]=(next[k]||0)+1}
 overlap=next;
 const nextIds=court.nextPlayerIds||[];
 if(nextIds.length===4){
  courts=courts.map(c=>c.id===courtId?{...c,playerIds:nextIds,nextPlayerIds:[],startTime:Date.now(),gameCount:c.gameCount+1}:c);
  players=players.map(p=>nextIds.includes(p.id)?{...p,status:"playing",courtId}:p);
 }else{
  courts=courts.map(c=>c.id===courtId?{...c,playerIds:[],nextPlayerIds:[],startTime:null,gameCount:c.gameCount+1}:c);
 }
 save();render();
}
function cancelAssign(courtId){assigningCourtId=null;render()}
function waitingPlayers(){return players.filter(p=>p.status==="waiting").sort((a,b)=>a.waitSince-b.waitSince)}

// ==========================================
// 5. 렌더링 화면
// ==========================================
function render(){
 const wait=waitingPlayers();
 document.getElementById("app").innerHTML=`
 <div class="page">
  <div class="header">
   <div class="headerLeft"><div class="shuttleIcon">🏸</div><div><div class="title">팅턴 게임판</div><div class="subtitle">배드민턴 동호회 조 편성 &amp; 코트 현황</div></div></div>
   <div class="courtCountGroup"><span class="courtCountLabel">코트 수</span>${[2,3,4].map(n=>`<button class="courtCountBtn ${courts.length===n?"active":""}" onclick="changeCourtCount(${n})">${n}</button>`).join("")}</div>
  </div>
  <div class="tabRow">
   <button class="tabBtn ${tab==="courts"?"active":""}" onclick="tab='courts';render()">${icon("trophy",15)} 코트 현황</button>
   <button class="tabBtn ${tab==="players"?"active":""}" onclick="tab='players';render()">${icon("users",15)} 오늘 선수 (${players.length})</button>
   <button class="tabBtn ${tab==="members"?"active":""}" onclick="tab='members';render()">${icon("book-user",15)} 회원 명단 (${members.length})</button>
   <button class="tabBtn ${tab==="stats"?"active":""}" onclick="tab='stats';render()">${icon("clock",15)} 기록</button>
  </div>
  ${tab==="courts"?renderCourts(wait):tab==="players"?renderPlayers():tab==="members"?renderMembers():renderStats()}
 </div>`;
 lucide.createIcons();
}

function renderCourts(wait){
 return `<div class="courtsLayout"><div class="courtsGrid">${courts.map(c=>renderCourt(c)).join("")}</div>
 <div class="sidebar"><div class="sideCard"><div class="sideTitle">대기 중 <span class="sideCount">${wait.length}</span></div>
 ${assigningCourtId!=null?`<div class="assignBanner">코트 ${assigningCourtId}에 배정할 선수를 클릭하세요 <button class="smallLinkBtn" onclick="cancelAssign(${assigningCourtId})">취소</button></div>`:""}
 <div class="sideList bcm-scroll">${wait.length===0?'<div class="emptyNote">대기 중인 선수가 없어요.</div>':wait.map(p=>`<div class="sideRow ${assigningCourtId!=null?"clickable":""}" onclick="${assigningCourtId!=null?`addToCourt(${assigningCourtId},${p.id})`:""}"><span><span style="color:${genderColor(p)};font-weight:600">${esc(p.name)}</span>${tierBadge(p,true)}</span><span class="sideGames">${p.games}경기</span></div>`).join("")}</div></div></div></div>`
}

function renderCourt(c){
 const isAssigning=assigningCourtId===c.id;
 const ps=c.playerIds.map(player).filter(Boolean);
 const isPlaying=ps.length===4;

 if(!isPlaying && !isAssigning){
  return `<div class="courtCard">
   <div class="courtCardHead"><span class="courtNum">코트 ${c.id}</span></div>
   <div class="emptyCourt">
    <div class="emptyText">${ps.length>0?`${ps.length}명 선택됨`:'비어있는 코트'}</div>
    <div class="emptyActions">
     <button class="autoBtn" onclick="autoMatch(${c.id})">자동 매칭</button>
     <button class="manualBtn" onclick="assigningCourtId=${c.id};render()">수동 선택</button>
    </div>
   </div>
  </div>`;
 }

 return `<div class="courtCard ${isAssigning?'assigning':''}">
  <div class="courtCardHead"><span class="courtNum">코트 ${c.id}</span><span class="badge ${isPlaying?'playing':'waiting'}">${isPlaying?'경기 중':'배정 중'}</span></div>
  ${isPlaying?`<div class="timerRow">${icon("clock",14)}<span class="timerText">${formatElapsed(c.startTime)}</span></div>`:''}
  <div class="teamBlock">
   <div class="teamNames" style="color:${genderColor(ps[0])}">${esc(ps[0]?.name||'-')} / ${esc(ps[1]?.name||'-')}</div>
   <div class="vsDivider">VS</div>
   <div class="teamNames" style="color:${genderColor(ps[2])}">${esc(ps[2]?.name||'-')} / ${esc(ps[3]?.name||'-')}</div>
  </div>
  ${isPlaying?`<button class="endBtn" onclick="endGame(${c.id})">게임 종료</button>`:`<button class="cancelBtn" style="width:100%;margin-top:10px" onclick="cancelAssign(${c.id})">취소</button>`}
 </div>`;
}

function renderPlayers(){
 return `<div class="playersWrap">
  <div class="addRow">
   <input class="input" placeholder="선수 이름" value="${esc(newName)}" oninput="newName=this.value">
   <div class="genderToggle">
    <button class="genderBtn m ${newGender==='M'?'active':''}" onclick="newGender='M';render()">남</button>
    <button class="genderBtn f ${newGender==='F'?'active':''}" onclick="newGender='F';render()">여</button>
   </div>
   <select class="tierSelect" onchange="newTier=this.value">${["S","A","B","C","D","초심","왕초심"].map(t=>`<option value="${t}" ${newTier===t?'selected':''}>${t}</option>`).join("")}</select>
   <button class="addBtn" onclick="addPlayer()">선수 추가</button>
   <button class="iconBtnDanger" onclick="clearAllPlayers()" title="전체 삭제" style="margin-left:auto">${icon("trash-2",16)}</button>
  </div>
  <div class="playerTable">
   <div class="playerTableHead"><span style="flex:2">이름</span><span class="flex1">급수</span><span class="flex1">상태</span><span class="flex1">경기수</span><span style="flex:1;text-align:right">관리</span></div>
   ${players.length===0?'<div class="emptyNote" style="padding:20px;text-align:center">등록된 선수가 없습니다.</div>':players.map(p=>`<div class="playerRow">
    <span class="playerNameCell" style="color:${genderColor(p)}">${esc(p.name)}</span>
    <span class="flex1">${tierBadge(p)}</span>
    <span class="flex1">${statusBadge(p.status)}</span>
    <span class="flex1" style="font-family:'IBM Plex Mono',monospace;font-weight:600">${p.games}</span>
    <span class="actionCell">
     <button class="iconBtn" onclick="toggleRest(${p.id})">${icon(p.status==='resting'?'play':'coffee',14)}</button>
     <button class="iconBtnDanger" onclick="removePlayer(${p.id})">${icon("x",14)}</button>
    </span>
   </div>`).join("")}
  </div>
 </div>`;
}

function renderMembers(){
 return `<div class="playersWrap">
  <div class="addRow">
   <input class="input" placeholder="회원 이름" value="${esc(newMemberName)}" oninput="newMemberName=this.value">
   <div class="genderToggle">
    <button class="genderBtn m ${newMemberGender==='M'?'active':''}" onclick="newMemberGender='M';render()">남</button>
    <button class="genderBtn f ${newMemberGender==='F'?'active':''}" onclick="newMemberGender='F';render()">여</button>
   </div>
   <select class="tierSelect" onchange="newMemberTier=this.value">${["S","A","B","C","D","초심","왕초심"].map(t=>`<option value="${t}" ${newMemberTier===t?'selected':''}>${t}</option>`).join("")}</select>
   <button class="addBtn" onclick="addMember()">회원 등록</button>
  </div>
  <div class="playerTable">
   <div class="playerTableHead"><span style="flex:2">회원 이름</span><span class="flex1">급수</span><span style="flex:2;text-align:right">오늘 참석</span></div>
   ${members.length===0?'<div class="emptyNote" style="padding:20px;text-align:center">등록된 회원이 없습니다.</div>':members.map(m=>`<div class="playerRow">
    <span class="playerNameCell" style="color:${GENDER_COLOR[m.gender]}">${esc(m.name)}</span>
    <span class="flex1">${tierBadge(m)}</span>
    <span class="actionCell" style="flex:2">
     <button class="manualBtn" style="padding:4px 10px;font-size:11.5px" onclick="addMemberToday(${m.id})">오늘 명단에 추가</button>
     <button class="iconBtnDanger" onclick="removeMember(${m.id})">${icon("x",14)}</button>
    </span>
   </div>`).join("")}
  </div>
 </div>`;
}

function renderStats(){
 const rank=Object.entries(overlap).map(([k,v])=>{
  const [a,b]=k.split('_').map(id=>player(Number(id)));
  return {a,b,count:v};
 }).filter(r=>r.a&&r.b).sort((a,b)=>b.count-a.count);

 return `<div class="statsWrap">
  <div>
   <div class="statsTitle">함께 게임한 횟수</div>
   ${rank.length===0?'<div class="emptyNote">완료된 게임 기록이 없습니다.</div>':rank.map(r=>`<div class="overlapRow">
    <span><strong style="color:${genderColor(r.a)}">${esc(r.a.name)}</strong> &amp; <strong style="color:${genderColor(r.b)}">${esc(r.b.name)}</strong></span>
    <span class="overlapCount">${r.count}회</span>
   </div>`).join("")}
  </div>
 </div>`;
}

render();
</script>
</body>
</html>
